```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NOPP</title>

<link href="https://fonts.googleapis.com/css2?family=Aladin&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

<style>
body{
  font-family:'Aladin', cursive;
  background-image:url("https://i.pinimg.com/736x/6b/21/12/6b211209c4901314be43910c3db946d2.jpg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  text-align:center;
  padding:40px;
  margin:0;
}

/* PANEL */
.container{
  max-width:750px;
  margin:400px auto 0 auto;
  padding:35px;
  border-radius:15px;
  background: rgba(0,0,0,0.25);
  backdrop-filter:blur(10px);
  display:flex;
  flex-direction:column;
  align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
  position:relative;
  overflow:hidden;
}

/* SPARKLING */
.container::before{
content:"";
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px, transparent 1px),
radial-gradient(white 1px, transparent 1px);
background-size:40px 40px;
animation:sparkle 6s linear infinite;
opacity:0.4;
pointer-events:none;
}

@keyframes sparkle{
0%{transform:translateY(0px)}
50%{transform:translateY(-10px)}
100%{transform:translateY(0px)}
}

/* JUDUL */
h1{
font-size:40px;
letter-spacing:3px;
color:#a6d4ff;
text-shadow:
0 0 5px #7ec8ff,
0 0 10px #7ec8ff,
0 0 20px #4aa8ff,
0 0 30px #4aa8ff;
margin-bottom:10px;
}

/* AYAT */
.verse{
color:white;
font-size:15px;
margin-bottom:20px;
opacity:0.9;
}

/* TEXTAREA */
textarea{
width:60%;
height:150px;
margin-top:10px;
font-size:16px;
padding:10px;
border-radius:8px;
border:none;
resize:none;
background:rgba(255,255,255,0.35);
color:black;
font-family:'Courier New', monospace;
}

/* BUTTON */
button{
padding:10px 18px;
margin-top:10px;
cursor:pointer;
border:none;
border-radius:8px;
background:#3b82f6;
color:white;
font-size:20px;
}

button:hover{
background:#2563eb;
}

/* FOOTER */
.footer-name{
margin-top:30px;
font-size:18px;
font-weight:bold;
color:#bde0ff;
text-shadow:0 0 10px #7ec8ff;
}

</style>
</head>

<body>

<div class="container">

<h1>NOPP</h1>

<div class="verse">
Percayalah kepada TUHAN dengan segenap hatimu, dan jangan bersandar kepada pengertianmu sendiri.
Akuilah Dia dalam segala lakumu, maka Ia akan meluruskan jalanmu.
<b>Amsal 3:5-6</b>
</div>

<textarea id="result" placeholder="Sini Guyssss hehehe"></textarea>

<br>

<input type="file" id="imageInput">

<br>

<button onclick="copyText()">📋</button>

</div>

<div class="footer-name">Nop Nop</div>

<script>

function runOCR(image){
Tesseract.recognize(
image,
'eng'
).then(({ data: { text } }) => {

let cleaned = text.replace(/\n+/g,"").replace(/\s+/g,"").trim();

const resultArea = document.getElementById("result");
resultArea.value = cleaned;

})
}

document.getElementById('imageInput').addEventListener('change',function(){
const file = this.files[0];
runOCR(file);
})

document.addEventListener('paste',function(event){

const items = event.clipboardData.items;

for (let i = 0; i < items.length; i++) {

if (items[i].type.indexOf("image") !== -1) {

const blob = items[i].getAsFile();
runOCR(blob);

}

}

})

function copyText(){
const textarea = document.getElementById("result");
textarea.select();
document.execCommand("copy");
}

</script>

</body>
</html>
